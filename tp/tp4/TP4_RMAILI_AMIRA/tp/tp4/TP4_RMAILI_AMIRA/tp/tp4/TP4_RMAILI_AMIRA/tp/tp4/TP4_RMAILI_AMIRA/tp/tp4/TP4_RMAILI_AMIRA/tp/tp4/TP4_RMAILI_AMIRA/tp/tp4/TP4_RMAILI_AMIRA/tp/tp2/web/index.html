
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaintAI : client web</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 520px;
    margin: 40px auto;
    padding: 0 16px;
  }
  label {
    display: block;
    margin-top: 12px;
  }
  input {
    width: 100%;
    padding: 6px;
    box-sizing: border-box;
  }
  button {
    margin-top: 16px;
    padding: 8px 16px;
    cursor: pointer;
  }
  #result {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    white-space: pre-wrap;
  }
  .ok { background: #e6f4ea; }
  .alert { background: #fde7e7; }
  .err { background: #fff4e5; }
</style>
</head>

<body>

<h1>MaintAI</h1>

<label>URL de l'API
  <input id="url" value="http://127.0.0.1:8000">
</label>

<label>Clé API
  <input id="key" type="password">
</label>

<label>Température (°C)
  <input id="temperature_c" type="number" step="0.1" value="72">
</label>

<label>Vibration (mm/s)
  <input id="vibration_mm_s" type="number" step="0.1" value="6">
</label>

<label>Charge (%)
  <input id="load_pct" type="number" step="1" value="85">
</label>

<label>Heures de fonctionnement
  <input id="runtime_hours" type="number" step="100" value="15000">
</label>

<button id="go">Prédire</button>

<div id="result"></div>

<script>
const FEATURES = [
  "temperature_c",
  "vibration_mm_s",
  "load_pct",
  "runtime_hours"
];

const show = (cls, text) => {
  const r = document.getElementById("result");
  r.className = cls;
  r.textContent = text;
};

document.getElementById("go").addEventListener("click", async () => {
  const button = document.getElementById("go");

  const reading = Object.fromEntries(
    FEATURES.map(f => [
      f,
      Number(document.getElementById(f).value)
    ])
  );

  const url = document.getElementById("url").value.trim().replace(/\/+$/, "");
  const key = document.getElementById("key").value.trim();

  if (!key) {
    show("err", "Veuillez saisir votre clé API.");
    return;
  }

  button.disabled = true;
  show("ok", "Prédiction en cours...");

  try {
    const response = await fetch(`${url}/v1/predict`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": key
      },
      body: JSON.stringify(reading)
    });

    const data = await response.json();

    if (!response.ok) {
      show("err", `Erreur ${response.status} : ${JSON.stringify(data)}`);
      return;
    }

    show("ok", "Prédiction réussie :\n" +
      JSON.stringify(data, null, 2));

  } catch (error) {
    show("err", "Impossible de contacter l'API : " + error.message);
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
